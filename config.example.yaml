# GradScout configuration template.
# Copy to config.yaml and edit. This file contains NO secrets (secrets are env vars).
# The watchlist and sources are editable without changing any application code.

candidate:
  graduation_year: 2027
  degree_level: bachelor            # informs deterministic eligibility rules
  role_families: [backend, ai, data, product]
  resume_variants: [backend, ai, data]
  # --- Location preference (Phase 5.2) ---
  # Recognized Bay Area / Northern California forms (case-insensitive substring
  # match against a job's location text). Editable without any code change.
  preferred_locations:
    [San Francisco, San Jose, Santa Clara, Sunnyvale, Mountain View, Palo Alto,
     Redwood City, Menlo Park, Cupertino, Oakland, Berkeley, Fremont, Pleasanton,
     San Mateo, South San Francisco, Bay Area, Silicon Valley, Northern California, NorCal]
  allow_us_remote: true              # a clearly U.S.-remote job is acceptable anywhere in the U.S.
  location_required_for_alert: true  # gate normal alerts on location fit (never on eligibility)
  remote_alert_priority_penalty: 1   # priority ranks to downgrade a remote_acceptable job by
  # --- Fresh-first alert window (Phase 6.2) ---
  # Individual (p1/p2/p3) alerts only fire for jobs whose SOURCE-provided
  # posted_at is within a rolling window ending at "now", so newly onboarded
  # sources never dump their historical backlog as if it were fresh.
  alert_overlap_minutes: 60      # window's lower bound = last successful run time minus this
  recovery_max_age_hours: 24     # used instead, if there's no/too-old a last successful run
  alert_clock_skew_minutes: 15   # a "posted" date further in the future than this is suppressed

# --- Resume-aware matching (Phase 6) ---
# Sanitized, purely-technical weighted-term profiles per resume variant -- NO
# personal information (no name/contact/education/dates), only skills/tools/
# technologies. Every eligible/review job is scored against ALL configured
# profiles (see gradscout/resume.py) and the highest scorer is recommended,
# with the top matched terms named in the Discord explanation. This is a
# trimmed illustrative example -- see config.yaml for the full production
# profiles. Leaving this section empty/omitted falls back to the pre-Phase-6
# role-family-only resume mapping (never breaks).
resume_profiles:
  ai:
    terms:
      - {term: llm, weight: 3, display: LLMs}
      - {term: embeddings, weight: 3}
      - {term: rag, weight: 3, display: RAG}
      - {term: pytorch, weight: 2, display: PyTorch}
  backend:
    terms:
      - {term: fastapi, weight: 3, display: FastAPI}
      - {term: distributed systems, weight: 3}
      - {term: postgresql, weight: 3, display: PostgreSQL}
      - {term: microservices, weight: 2}
  data:
    terms:
      - {term: etl, weight: 3, display: ETL}
      - {term: data modeling, weight: 3}
      - {term: sql optimization, weight: 2}
      - {term: tableau, weight: 2, display: Tableau}

# High-priority companies. company_priority: 1 = highest.
# coverage_status is DERIVED at runtime (not set here):
#   direct    -> a native ATS source (greenhouse/lever/ashby) is configured for this company
#   indirect  -> only represented via a github_repo source
#   not_configured -> on watchlist but no source covers it
#   failed    -> its direct source errored on the latest run
# aliases help match the same company across differently-named sources/repos.
watchlist:
  - name: Stripe
    company_priority: 1
    aliases: [stripe]
  - name: OpenAI
    company_priority: 1
    aliases: [openai]
  - name: Anthropic
    company_priority: 1
    aliases: [anthropic]

# Native ATS sources. Configuring one here gives a watchlist company "direct" coverage.
greenhouse:
  - company: Stripe
    board: stripe
    company_priority: 1

lever:
  - company: LeverDemo
    board: leverdemo
    company_priority: 3

# Note: Anthropic is on the watchlist but has NO direct source below, so it will
# show coverage_status = not_configured (or indirect if a GitHub repo lists it) --
# an honest example of not implying direct monitoring.
ashby:
  - company: OpenAI
    board: openai
    company_priority: 1

# Rippling ATS (companies using Rippling's own applicant-tracking product --
# a distinct public JSON API from Greenhouse/Lever/Ashby; Phase 6).
rippling:
  - company: Rippling
    board: rippling
    company_priority: 3

# GitHub new-grad repositories. These provide INDIRECT coverage only.
# Prefer a structured JSON feed (simplify_json) over scraping the HTML README.
github_repos:
  - name: SimplifyJobs-NewGrad
    url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json
    parser: simplify_json

# Keyword filters applied during normalization / role matching.
include_keywords: [software engineer, backend, machine learning, data engineer, new grad, entry level]
exclude_keywords: [senior, staff, principal, manager, director]

notifications:
  discord_min_priority: p2          # p1 | p2 | p3 : minimum priority to alert immediately
  # DISABLED by default (Phase 6.1 UX fix): the review digest tends to
  # overwhelm the far more useful individual P1/P2/P3 alerts. Review
  # classification/storage in SQLite is unaffected either way -- this only
  # governs whether a batched review-digest Discord message is ever sent.
  # Set to `true` to opt back into the batched low-priority digest.
  send_review_digest: false
  max_alerts_per_run: 25            # cap PER RUN; unsent jobs stay pending and are delivered later
  send_healthy_reports: false       # do NOT send hourly healthy summaries
  daily_summary_hour_utc: 13        # send one daily success summary at this UTC hour
  new_grad_recent_hours: 48         # "recently discovered" window for p1 urgency
  max_years_experience: 5           # >= this many required years => ineligible (unless softened)
  # --- Company diversity (Phase 6) ---
  # Caps how many individual alerts / review-digest items from the SAME
  # company one run may select -- see gradscout/diversify.py.
  max_alerts_per_company_per_run: 3
  max_review_items_per_company_per_run: 3

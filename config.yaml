# GitHub new-grad repositories. These provide INDIRECT coverage only.
# Prefer a structured JSON feed (simplify_json) over scraping the HTML README.
# This is the sole coverage path for: Google, Meta, Amazon, Microsoft, Apple,
# and Scale AI (no verified direct board), plus a backstop for every other
# watchlist company and any company not on the watchlist at all.
github_repos:
  - name: SimplifyJobs-NewGrad
    url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json
    parser: simplify_json

# Keyword filters -- DOCUMENTATION OF INTENT ONLY. NOT ACTIVE FILTERS.
# As of this writing, gradscout/pipeline.py, gradscout/analyze.py,
# gradscout/roles.py, and gradscout/eligibility.py never read
# config.include_keywords / config.exclude_keywords -- role-family and
# eligibility classification instead use fixed, hardcoded keyword vocabularies
# in gradscout/roles.py and gradscout/eligibility.py. Editing the two lists
# below currently has NO effect on which jobs are collected, classified, or
# alerted. They are recorded here only to document search intent (2027
# new-grad; backend/software engineering/platform/infrastructure; AI/ML/
# applied AI; data engineering; product engineering) for a future phase that
# may wire them into the classifier. Do not rely on them today.
include_keywords: [new grad, "2027", entry level, early career, university grad, software engineer, backend, platform, infrastructure, site reliability, machine learning, applied ai, ai engineer, data engineer, data engineering, product engineer]
exclude_keywords: [senior, staff, principal, director, manager, lead, architect, phd required]

notifications:
  discord_min_priority: p3          # p1 | p2 | p3 : minimum priority to alert immediately
  # --- Review digest (Phase 6.1 UX fix) ---
  # DISABLED by default in production: the digest tends to overwhelm the far
  # more useful individual P1/P2/P3 alerts with a large batch of ambiguous
  # roles. Eligibility review classification and SQLite storage are
  # completely unaffected by this setting (see gradscout/eligibility.py,
  # gradscout/roles.py) -- every job is still classified `review` and stored
  # normally; this only governs whether a review-priority Discord message is
  # ever queued/sent. While disabled, a review job's alert is simply never
  # enqueued (so it cannot accumulate as pending notification spam); any
  # alert already pending from before this was set is explicitly suppressed
  # with reason "suppressed_review_digest_disabled" -- the same auditable
  # mechanism as the company-diversity cap below. Flip to `true` to restore
  # the batched low-priority digest.
  send_review_digest: false
  max_alerts_per_run: 25            # cap PER RUN; unsent jobs stay pending and are delivered later
  send_healthy_reports: false       # do NOT send hourly healthy summaries
  daily_summary_hour_utc: 13        # send one daily success summary at this UTC hour
  new_grad_recent_hours: 48         # "recently discovered" window for p1 urgency
  max_years_experience: 3           # >= this many required years => ineligible (unless softened)
  # --- Company diversity (Phase 6) ---
  # Caps how many individual alerts / review-digest items from the SAME
  # company one run may select, so a single prolific poster (e.g. OpenAI)
  # can never dominate every alert/digest -- see gradscout/diversify.py.
  # Company-cap-suppressed jobs are marked AlertState.suppressed (reason
  # "suppressed_company_cap"), never resent every run, and only become
  # reconsiderable again if the underlying job materially changes.
  max_alerts_per_company_per_run: 3
  max_review_items_per_company_per_run: 3

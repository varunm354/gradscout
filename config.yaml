# GradScout PRODUCTION configuration.
# Generated from the approved 25-company watchlist proposal (see chat history /
# docs/PHASE_5_HANDOFF.md §9.3). Contains NO secrets -- safe to commit to `main`.
#
# Direct Greenhouse/Lever/Ashby sources below were live-verified against the
# real public board APIs immediately before this file was written (job counts
# observed, not guessed). Companies without a verified direct source are kept
# on the watchlist for company_priority matching, but rely on indirect
# coverage via the Simplify GitHub feed -- see the `github_repos` section.

candidate:
  graduation_year: 2027
  degree_level: bachelor
  role_families: [backend, ai, data, product]
  resume_variants: [backend, ai, data]

# High-priority companies. company_priority: 1 = highest.
# coverage_status is DERIVED at runtime (not set here):
#   direct    -> a native ATS source (greenhouse/lever/ashby) is configured for this company
#   indirect  -> only represented via a github_repo source
#   not_configured -> on watchlist but no source covers it
#   failed    -> its direct source errored on the latest run
# aliases help match the same company across differently-named sources/repos.
watchlist:
  # --- Big Tech (priority 1) -- indirect only: no public Greenhouse/Lever/
  # Ashby board exists for these; they use proprietary ATS platforms. Coverage
  # is via the Simplify feed only. Kept at priority 1 so a Simplify-sourced hit
  # still triggers urgent (P1-eligible) treatment.
  - name: Google
    company_priority: 1
    aliases: [google, alphabet]
  - name: Meta
    company_priority: 1
    aliases: [meta, facebook]
  - name: Amazon
    company_priority: 1
    aliases: [amazon, aws]
  - name: Microsoft
    company_priority: 1
    aliases: [microsoft]
  - name: Apple
    company_priority: 1
    aliases: [apple]

  # --- AI / AI Infrastructure (priority 1 for the two top labs, else 2) ---
  - name: OpenAI
    company_priority: 1
    aliases: [openai]
  - name: Anthropic
    company_priority: 1
    aliases: [anthropic]
  - name: Databricks
    company_priority: 2
    aliases: [databricks]
  - name: Perplexity AI
    company_priority: 2
    aliases: [perplexity, perplexity ai]
  - name: Cohere
    company_priority: 2
    aliases: [cohere]
  - name: Scale AI
    company_priority: 2
    aliases: [scale ai, scaleai]   # indirect only -- no verified direct board (see sources)

  # --- Developer Tools / Cloud / Data (priority 2) ---
  - name: Stripe
    company_priority: 2
    aliases: [stripe]
  - name: Cloudflare
    company_priority: 2
    aliases: [cloudflare]
  - name: Datadog
    company_priority: 2
    aliases: [datadog]
  - name: MongoDB
    company_priority: 2
    aliases: [mongodb]
  - name: GitLab
    company_priority: 2
    aliases: [gitlab]
  - name: Elastic
    company_priority: 2
    aliases: [elastic, elasticsearch]
  - name: Palantir
    company_priority: 2
    aliases: [palantir, palantir technologies]

  # --- High-growth product companies (priority 2) ---
  - name: Figma
    company_priority: 2
    aliases: [figma]
  - name: Discord
    company_priority: 2
    aliases: [discord]
  - name: Coinbase
    company_priority: 2
    aliases: [coinbase]
  - name: Robinhood
    company_priority: 2
    aliases: [robinhood]
  - name: Airbnb
    company_priority: 2
    aliases: [airbnb]
  - name: Instacart
    company_priority: 2
    aliases: [instacart]
  - name: Samsara
    company_priority: 2
    aliases: [samsara]


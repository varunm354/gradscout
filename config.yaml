# GradScout PRODUCTION configuration.
# Generated from the approved 25-company watchlist proposal (see chat history /
# docs/PHASE_5_HANDOFF.md §9.3), extended in Phase 6 with resume-aware
# matching, company-diversity caps, and expanded startup coverage, then
# refined in Phase 6.1 to disable the review digest by default (see
# docs/PHASE_6_HANDOFF.md). Contains NO secrets -- safe to commit to `main`.
#
# Direct Greenhouse/Lever/Ashby/Rippling sources below were live-verified
# against the real public board APIs immediately before this file was written
# (job counts observed, not guessed). Companies without a verified direct
# source are kept on the watchlist for company_priority matching, but rely on
# indirect coverage via the Simplify GitHub feed -- see the `github_repos`
# section.

candidate:
  graduation_year: 2027
  degree_level: bachelor
  role_families: [backend, ai, data, product]
  resume_variants: [backend, ai, data]
  # --- Location preference (Phase 5.2) ---
  # Recognized Bay Area / Northern California forms (case-insensitive substring
  # match against a job's location text). A job never has to be ONLY these -- a
  # multi-location listing with even one of these is "preferred".
  preferred_locations:
    [San Francisco, San Jose, Santa Clara, Sunnyvale, Mountain View, Palo Alto,
     Redwood City, Menlo Park, Cupertino, Oakland, Berkeley, Fremont, Pleasanton,
     San Mateo, South San Francisco, Bay Area, Silicon Valley, Northern California, NorCal]
  allow_us_remote: true              # a clearly U.S.-remote job is acceptable anywhere in the U.S.
  location_required_for_alert: true  # gate normal alerts on location fit (never on eligibility)
  remote_alert_priority_penalty: 1   # priority ranks to downgrade a remote_acceptable job by

# --- Resume-aware matching (Phase 6) ---
# Sanitized, purely-technical weighted-term profiles for the three resume
# variants -- NO personal information (no name/contact/education/dates), only
# skills/tools/technologies/technical-experience areas. Every eligible/review
# job is scored against ALL THREE profiles (see gradscout/resume.py); the
# highest-scoring variant is recommended, and the top matched terms (by
# weight) become the human-readable explanation shown in every Discord alert.
# Editable here without any code change -- same philosophy as `watchlist`.
resume_profiles:
  ai:
    terms:
      - {term: llm, weight: 3, display: LLMs}
      - {term: large language model, weight: 3, display: LLMs}
      - {term: embeddings, weight: 3}
      - {term: embedding, weight: 3, display: Embeddings}
      - {term: rag, weight: 3, display: RAG}
      - {term: retrieval augmented generation, weight: 3, display: RAG}
      - {term: vector database, weight: 3}
      - {term: vector search, weight: 3}
      - {term: pgvector, weight: 2}
      - {term: applied ml, weight: 3, display: Applied ML}
      - {term: applied machine learning, weight: 3, display: Applied ML}
      - {term: machine learning, weight: 2}
      - {term: pytorch, weight: 2, display: PyTorch}
      - {term: tensorflow, weight: 2, display: TensorFlow}
      - {term: scikit-learn, weight: 2, display: scikit-learn}
      - {term: semantic search, weight: 3}
      - {term: semantic ranking, weight: 3}
      - {term: ai observability, weight: 3}
      - {term: model validation, weight: 2}
      - {term: model integration, weight: 2}
      - {term: nlp, weight: 2, display: NLP}
      - {term: generative ai, weight: 2, display: Generative AI}
      - {term: pandas, weight: 1, display: pandas}
      - {term: numpy, weight: 1, display: NumPy}
  backend:
    terms:
      - {term: rest api, weight: 2, display: REST APIs}
      - {term: rest apis, weight: 2, display: REST APIs}
      - {term: restful api, weight: 2, display: REST APIs}
      - {term: distributed systems, weight: 3}
      - {term: fastapi, weight: 3, display: FastAPI}
      - {term: flask, weight: 2, display: Flask}
      - {term: database design, weight: 2}
      - {term: asynchronous, weight: 2}
      - {term: async, weight: 1, display: Async}
      - {term: system architecture, weight: 2}
      - {term: microservices, weight: 3}
      - {term: postgresql, weight: 3, display: PostgreSQL}
      - {term: postgres, weight: 2, display: Postgres}
      - {term: database indexing, weight: 2}
      - {term: worker pipeline, weight: 2}
      - {term: worker pipelines, weight: 2}
      - {term: backend schema, weight: 2}
      - {term: backend schemas, weight: 2}
      - {term: api, weight: 1, display: API}
  data:
    terms:
      - {term: etl, weight: 3, display: ETL}
      - {term: etl pipeline, weight: 3, display: ETL pipelines}
      - {term: etl pipelines, weight: 3, display: ETL pipelines}
      - {term: data modeling, weight: 3}
      - {term: sql optimization, weight: 3}
      - {term: sql, weight: 1, display: SQL}
      - {term: data warehousing, weight: 3}
      - {term: data warehouse, weight: 3}
      - {term: analytics, weight: 2}
      - {term: dashboarding, weight: 2}
      - {term: dashboard, weight: 1, display: Dashboards}
      - {term: pandas, weight: 1, display: pandas}
      - {term: numpy, weight: 1, display: NumPy}
      - {term: tableau, weight: 3, display: Tableau}
